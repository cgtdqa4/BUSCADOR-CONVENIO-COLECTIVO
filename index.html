    let currentChapterIndex = 0;

    function init() {
      renderTabs();
      renderContent();

      document.getElementById('searchInput').addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase().trim();
        renderContent(query);
      });
    }

    function renderTabs() {
      const tabsNav = document.getElementById('tabsNav');
      tabsNav.innerHTML = '';
      
      conveniodata.forEach((chap, index) => {
        const btn = document.createElement('button');
        btn.textContent = chap.capitulo.split('.')[0];
        btn.title = chap.capitulo;
        if (index === currentChapterIndex) btn.classList.add('active');
        btn.onclick = () => {
          currentChapterIndex = index;
          document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById('searchInput').value = '';
          renderContent();
        };
        tabsNav.appendChild(btn);
      });
    }

    function renderContent(searchQuery = '') {
      const contentArea = document.getElementById('contentArea');
      contentArea.innerHTML = '';

      let itemsToDisplay = [];

      if (searchQuery) {
        conveniodata.forEach(chap => {
          chap.articulos.forEach(art => {
            if (art.num.toLowerCase().includes(searchQuery) ||
                art.titulo.toLowerCase().includes(searchQuery) ||
                art.texto.toLowerCase().includes(searchQuery)) {
              itemsToDisplay.push(art);
            }
          });
        });
      } else {
        itemsToDisplay = conveniodata[currentChapterIndex].articulos;
      }

      if (itemsToDisplay.length === 0) {
        contentArea.innerHTML = `<div class="no-results">No se encontraron artículos que coincidan con "${searchQuery}".</div>`;
        return;
      }

      itemsToDisplay.forEach(art => {
        const card = document.createElement('div');
        card.className = 'article-card';
        
        let textHighlighted = art.texto;
        let titleHighlighted = `${art.num}: ${art.titulo}`;

        if (searchQuery) {
          const regex = new RegExp(`(${searchQuery})`, 'gi');
          if (!textHighlighted.includes('<table')) {
            textHighlighted = textHighlighted.replace(regex, '<mark>$1</mark>');
          }
          titleHighlighted = titleHighlighted.replace(regex, '<mark>$1</mark>');
        }

        card.innerHTML = `
          <h2>${titleHighlighted}</h2>
          <div class="article-content">${textHighlighted}</div>
        `;
        contentArea.appendChild(card);
      });
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
